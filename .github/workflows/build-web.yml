name: Build Web Artifacts
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-web.yml
      - "apps/web/**"
      - "packages/shared/**"
      - "packages/ui/**"
      - "packages/configs/**"
      - "packages/locales/**"
      - "packages/resource-provider/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-web.yml
      - "apps/web/**"
      - "packages/shared/**"
      - "packages/ui/**"
      - "packages/configs/**"
      - "packages/locales/**"
      - "packages/resource-provider/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            targetName: linux-x86_64-gnu

          - platform: macos-latest
            target: x86_64-apple-darwin
            targetName: macOS-x86_64

          - platform: macos-latest
            target: aarch64-apple-darwin
            targetName: macOS-aarch64

          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            targetName: windows-x86_64

    runs-on: ${{ matrix.platform }}
    name: build (${{ matrix.platform }}, ${{ matrix.target }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager"

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-web-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-web-
            ${{ runner.os }}-cargo-web-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir apps/web frontend:build

      - name: Build backend
        run: cargo build --release --manifest-path apps/web/Cargo.toml --target ${{ matrix.target }}

      - name: Strip Binary (macos & ubuntu only)
        if: matrix.platform == 'macos-latest' || matrix.platform == 'ubuntu-latest'
        run: strip "target/${{ matrix.target }}/release/mcsl_future_web"

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: MCSL-Future-Web-${{ matrix.targetName }}
          path: target/${{ matrix.target }}/release/mcsl_future_web${{ matrix.platform == 'windows-latest' && '.exe' || '' }}
          if-no-files-found: error
